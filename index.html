<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/dtajer.png" />
  <title>منصة التاجر الرقمي - خدمات متكاملة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            apple: {
              blue: '#0071e3',
              gray: '#1d1d1f',
              'gray-light': '#f5f5f7'
            }
          },
          lineHeight: {
            'none': '1.1',
            'tight': '1.2',
            'snug': '1.3',
            'normal': '1.5',
            'relaxed': '1.6',
            'loose': '2',
          },
          fontFamily: {
            sans: ['"IBM Plex Sans Arabic"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --apple-blue: #0071e3;
      --apple-gray: #1d1d1f;
      --apple-gray-light: #f5f5f7;
      --bg-primary: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --card-bg: #f5f5f7;
      --border-color: rgba(0, 0, 0, 0.08);
      --nav-blur: rgba(255, 255, 255, 0.75);
    }

    /* Modern Responsive Font System - Re-balanced for better scale */
    html {
      font-size: 16px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    @media (max-width: 768px) {
      html { font-size: 15px; }
    }

    @media (min-width: 1440px) {
      html { font-size: 17px; }
    }

    @media (min-width: 1920px) {
      html { font-size: 18px; }
    }

    /* Force global line-height for better readability */
    body, p, li, a, span {
      line-height: 1.6 !important;
    }

    h1, h2, h3, h4, h5, h6 {
      line-height: 1.15 !important;
    }

    :root.dark {
      --bg-primary: #000000;
      --text-primary: #ffffff;
      --text-secondary: #86868b;
      --card-bg: #151516;
      --border-color: rgba(255, 255, 255, 0.08);
      --nav-blur: rgba(0, 0, 0, 0.75);
    }

    /* Premium Apple-style Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background-color: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background-color: rgba(120, 120, 120, 0.3);
      border-radius: 9999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    .dark ::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.2);
    }

    body {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.5s ease;
      direction: rtl;
    }

    /* Premium Typography Classes - Adjusted to be more conservative on large screens */
    .hero-title-apple {
      font-size: clamp(2.4rem, 7vw, 4.8rem);
      line-height: 1.1 !important;
      letter-spacing: -0.04em;
      font-weight: 900;
      color: var(--text-primary);
    }

    .section-title-apple {
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1.15 !important;
      letter-spacing: -0.03em;
      font-weight: 800;
      color: var(--text-primary);
    }

    .apple-blur {
      backdrop-filter: saturate(180%) blur(20px);
      background-color: var(--nav-blur);
    }

    .section-padding {
      padding-top: clamp(2.5rem, 6vh, 6rem);
      padding-bottom: clamp(2.5rem, 6vh, 6rem);
      padding-left: 1rem;
      padding-right: 1rem;
    }

    @media (min-width: 1024px) {
      .section-padding {
        padding-left: 4rem;
        padding-right: 4rem;
      }
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    .bento-card {
      background: var(--card-bg);
      border-radius: 2rem;
      border: 1px solid var(--border-color);
      overflow: hidden;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bento-card:hover {
      border-color: var(--text-secondary);
      transform: translateY(-5px) scale(1.01);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
    }

    .dark .bento-card:hover {
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react-router-dom": "https://esm.sh/react-router-dom@^6.22.3",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
      }
    }
    </script>
</head>

<body>
  <div id="root"></div>
  <script>
    const observerOptions = { threshold: 0.1 };
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('active');
      });
    }, observerOptions);

    function initReveals() {
      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    }

    window.addEventListener('load', initReveals);
    const domObserver = new MutationObserver(() => initReveals());
    domObserver.observe(document.body, { childList: true, subtree: true });
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
